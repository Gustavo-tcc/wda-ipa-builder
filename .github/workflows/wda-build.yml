name: Build WDA IPA

"on":
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"  # gatilho server-side

permissions:
  contents: write

jobs:
  build-unsigned:
    runs-on: macos-latest
    steps:
      - name: Clone appium WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build WebDriverAgentRunner (unsigned)
        run: |
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "$GITHUB_WORKSPACE/wda-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP="$GITHUB_WORKSPACE/wda-build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          if [ ! -d "$APP" ]; then
            echo "Runner .app nao encontrado:"
            find "$GITHUB_WORKSPACE/wda-build" -name "*.app" || true
            exit 1
          fi

      - name: Package IPA (unsigned)
        run: |
          SRC="$GITHUB_WORKSPACE/wda-build/Build/Products/Release-iphoneos"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$SRC/WebDriverAgentRunner-Runner.app" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -qry WebDriverAgent-unsigned.ipa Payload
          ls -la WebDriverAgent-unsigned.ipa

      - name: Create Release com IPA unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wda-unsigned-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" WebDriverAgent-unsigned.ipa \
            --title "WDA unsigned ($TAG)" \
            --notes "IPA nao assinado do appium/WebDriverAgent." \
            --repo "$GITHUB_REPOSITORY" || true

  sign:
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ASP: ${{ secrets.APPLE_ASP }}
      DEVICE_UDID: 8c2ed50ba1cabe9fa883d83417fc5b97b8eb8136
      BUNDLE_ID: com.facebook.WebDriverAgentRunner
    steps:
      - uses: actions/checkout@v4

      - name: git local p/ status
        run: |
          git config --global user.email "ci@wda-ipa-builder.local"
          git config --global user.name "ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install fastlane
        run: sudo gem install fastlane -N --no-document

      - name: Register device + match (cert + profile de desenvolvimento)
        run: |
          set -e
          echo "$DEVICE_UDID" > devices.txt
          mkdir -p /tmp/matchrepo && cd /tmp/matchrepo
          git init -q && git commit -q --allow-empty -m init
          cd "$GITHUB_WORKSPACE"
          export FASTLANE_USER="$APPLE_ID"
          export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD="$APPLE_ASP"
          export MATCH_PASSWORD="wda-poc"
          fastlane run register_devices devices_file:devices.txt
          fastlane match development \
            --app_identifier "$BUNDLE_ID" \
            --git_url "file:///tmp/matchrepo" \
            --readonly false \
            --force_for_new_devices
          echo "match OK" >> ci-status.md

      - name: Build + archive + export IPA assinado
        run: |
          set -e
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git
          TEAM=$(security find-identity -v -p codesigning | grep -o 'Apple Development: [^"]*"([A-Z0-9]\{10\})"' | grep -o '[A-Z0-9]\{10\}' | head -1)
          echo "TEAM=$TEAM"
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          PROFILE_NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw - 2>/dev/null || security cms -D -i "$PROFILE" | grep -A1 '<key>Name</key>' | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "$TEAM" > team_id.txt
          echo "$PROFILE_NAME" > profile_name.txt
          cd WebDriverAgent
          xcodebuild archive \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$GITHUB_WORKSPACE/wda.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cd "$GITHUB_WORKSPACE"
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          mkdir -p out
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/wda.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$GITHUB_WORKSPACE/out"
          ls -la out/
          IPA=$(ls out/*.ipa | head -1)
          cp "$IPA" WebDriverAgent-signed.ipa
          codesign -dv --verbose=2 WebDriverAgent-signed.ipa 2>&1 | head -5 || true
          unzip -l WebDriverAgent-signed.ipa | head -5

      - name: Publicar IPA assinado no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wda-signed-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" WebDriverAgent-signed.ipa \
            --title "WDA assinado (Apple Development) ($TAG)" \
            --notes "IPA do WebDriverAgentRunner assinado com certificado Apple Development + profile com UDID 8c2ed50ba1cabe9fa883d83417fc5b97b8eb8136. Instalar com ideviceinstaller." \
            --repo "$GITHUB_REPOSITORY"

      - name: Reportar status no repo (debug)
        if: always()
        run: |
          echo "run ${GITHUB_RUN_NUMBER} job sign fim: $(date -u)" >> ci-status.md
          git add ci-status.md && git commit -qm "ci: status run ${GITHUB_RUN_NUMBER}" && git push || true
